<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @font-face {
        font-family: 'GraffitiYouth';
        src: url('GraffitiYouth-Regular.otf') format('opentype');
      }
    </style>
  </defs>
  
  <!-- Black background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Text "Navalha de Ouro" with graffiti font - centered and larger -->
  <text x="256" y="250" font-family="GraffitiYouth, sans-serif" font-size="42" font-weight="bold" 
        text-anchor="middle" fill="#FFD700">Navalha</text>
  <text x="256" y="290" font-family="GraffitiYouth, sans-serif" font-size="42" font-weight="bold" 
        text-anchor="middle" fill="#FFD700">de Ouro</text>
</svg>
